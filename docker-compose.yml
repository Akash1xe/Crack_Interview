services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/backendtyper
      PORT: 4000
      ADMIN_PIN: ${ADMIN_PIN:-2468}
    ports: ["4000:4000"]
    depends_on: [mongo]
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mongo_data:
