services:
  content-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interviewdrill
      POSTGRES_PASSWORD: interviewdrill
      POSTGRES_DB: content_db
    ports: ["5433:5432"]
    volumes: [content_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewdrill -d content_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  session-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interviewdrill
      POSTGRES_PASSWORD: interviewdrill
      POSTGRES_DB: session_db
    ports: ["5434:5432"]
    volumes: [session_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewdrill -d session_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  evaluation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interviewdrill
      POSTGRES_PASSWORD: interviewdrill
      POSTGRES_DB: evaluation_db
    ports: ["5435:5432"]
    volumes: [evaluation_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewdrill -d evaluation_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  content-service:
    build: ./services/content-service
    environment:
      PORT: 4001
      DATABASE_URL: postgres://interviewdrill:interviewdrill@content-db:5432/content_db
    ports: ["4001:4001"]
    depends_on:
      content-db:
        condition: service_healthy

  session-service:
    build: ./services/session-service
    environment:
      PORT: 4002
      DATABASE_URL: postgres://interviewdrill:interviewdrill@session-db:5432/session_db
      CONTENT_SERVICE_URL: http://content-service:4001
      REDIS_URL: redis://redis:6379
    ports: ["4002:4002"]
    depends_on:
      session-db:
        condition: service_healthy
      content-service:
        condition: service_started
      redis:
        condition: service_started

  evaluation-service:
    build: ./services/evaluation-service
    environment:
      PORT: 4003
      DATABASE_URL: postgres://interviewdrill:interviewdrill@evaluation-db:5432/evaluation_db
      REDIS_URL: redis://redis:6379
      SESSION_SERVICE_URL: http://session-service:4002
      CONTENT_SERVICE_URL: http://content-service:4001
    ports: ["4003:4003"]
    depends_on:
      evaluation-db:
        condition: service_healthy
      session-service:
        condition: service_started
      content-service:
        condition: service_started
      redis:
        condition: service_started

  gateway:
    build: ./services/gateway
    environment:
      PORT: 4000
      DEV_TOKEN: dev-token
      CONTENT_SERVICE_URL: http://content-service:4001
      SESSION_SERVICE_URL: http://session-service:4002
      EVALUATION_SERVICE_URL: http://evaluation-service:4003
    ports: ["4000:4000"]
    depends_on: [content-service, session-service, evaluation-service]

  frontend:
    build: ./frontend
    environment:
      VITE_GATEWAY_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [gateway]

volumes:
  content_pg:
  session_pg:
  evaluation_pg:
